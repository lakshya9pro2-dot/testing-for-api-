services:
  - type: web
    name: watch-progress-api
    runtime: go
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: go build -trimpath -ldflags='-s -w' -o watch-progress-api .
    startCommand: ./watch-progress-api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
